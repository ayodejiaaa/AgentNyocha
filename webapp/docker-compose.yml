# Everything on ONE box, including the database (a Postgres container) - the
# quickest route to a working system for a trial or staging. For the AWS setup
# (managed database, S3, HTTPS, the review screen) use docker-compose.aws.yml and
# webapp/DEPLOY_AWS.md instead.
#
#   cp .env.example .env     # fill it in
#   docker compose up -d --build
#
# Both services refuse to start unless JWT_SECRET and CORS_ALLOW_ORIGINS are set
# (see api/config.py) - an unsafe deployment fails loudly instead of running.

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg2://akowe:${POSTGRES_PASSWORD}@db:5432/extraction_review
  JWT_SECRET: ${JWT_SECRET:?set a random secret in .env (openssl rand -hex 32)}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?set the review screen's exact address in .env}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: akowe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a password in .env (letters and digits only - it goes inside a URL)}
      POSTGRES_DB: extraction_review
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akowe -d extraction_review"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: webapp/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment: *app-env
    volumes:
      - local_files:/app/webapp/api/_local_data  # only used while STORAGE_BACKEND=local
    ports:
      - "8000:8000"  # put TLS in front of this (Caddy / a load balancer) - see DEPLOY_AWS.md
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: webapp/api/Dockerfile
    command: ["python", "-m", "webapp.api.worker"]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment: *app-env
    volumes:
      - local_files:/app/webapp/api/_local_data
    stop_grace_period: 30s  # a job cut off by a restart is put back in the queue by the next sweep (worker.py)

volumes:
  db_data:
  local_files:
